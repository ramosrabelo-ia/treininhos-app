plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.luanarabelo.treinodaluana.v12'
    compileSdk 36

    signingConfigs {
        xiaomiTest {
            storeFile rootProject.file('test-only-signing.jks')
            storePassword 'TreinoLuaV12Teste2026'
            keyAlias 'treino-lua-xiaomi-test'
            keyPassword 'TreinoLuaV12Teste2026'
        }
    }

    defaultConfig {
        applicationId 'com.luanarabelo.treinodaluana.v12'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '12.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.xiaomitest'
            versionNameSuffix '-xiaomi-teste'
            signingConfig signingConfigs.xiaomiTest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

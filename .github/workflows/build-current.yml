name: Build Treino da Luana V19

on:
  push:
    branches: [main]
    paths:
      - 'treino-da-luana/v16/**'
      - '.github/workflows/build-current.yml'
  pull_request:
    branches: [main]
    paths:
      - 'treino-da-luana/v16/**'
      - '.github/workflows/build-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android and Wear OS
        working-directory: treino-da-luana/v16
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-V19-Celular
          path: treino-da-luana/v16/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Galaxy Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-V19-Galaxy-Watch8
          path: treino-da-luana/v16/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

name: Validar Treino da Luana V16

on:
  push:
    branches: [main]
    paths:
      - 'treino-da-luana/v16/**'
      - '.github/workflows/build-treino-da-luana-v16.yml'
  pull_request:
    branches: [main]
    paths:
      - 'treino-da-luana/v16/**'
      - '.github/workflows/build-treino-da-luana-v16.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar Xiaomi e Galaxy Watch8
        working-directory: treino-da-luana/v16
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Publicar build de validação do Xiaomi
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-v16-Xiaomi-CI
          path: treino-da-luana/v16/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar build de validação do Galaxy Watch8
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-v16-Galaxy-Watch8-CI
          path: treino-da-luana/v16/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

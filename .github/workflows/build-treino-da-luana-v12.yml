name: Build Treino da Luana v12

on:
  push:
    branches: [main]
    paths:
      - 'treino-da-luana/v12/**'
      - '.github/workflows/build-treino-da-luana-v12.yml'
  pull_request:
    branches: [main]
    paths:
      - 'treino-da-luana/v12/**'
      - '.github/workflows/build-treino-da-luana-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar assinatura estável do teste Xiaomi
        working-directory: treino-da-luana/v12
        run: |
          if [ ! -f test-only-signing.jks ]; then
            keytool -genkeypair \
              -keystore test-only-signing.jks \
              -storepass TreinoLuaV12Teste2026 \
              -alias treino-lua-xiaomi-test \
              -keypass TreinoLuaV12Teste2026 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Treino da Luana Xiaomi Teste, O=R4, C=BR"
          fi

      - name: Compilar APK da V12 para Xiaomi
        working-directory: treino-da-luana/v12
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK do Xiaomi
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-v12-Xiaomi-teste
          path: |
            treino-da-luana/v12/app/build/outputs/apk/debug/app-debug.apk
            treino-da-luana/v12/test-only-signing.jks
          if-no-files-found: error

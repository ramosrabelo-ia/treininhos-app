name: Compilar Musculação
on:
  pull_request:
    paths: [ 'musculacao/**', '.github/workflows/build-musculacao.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar plataforma Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Compilar app do relógio
        working-directory: musculacao
        run: gradle :wear:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Musculacao-Relogio-TESTE
          path: musculacao/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error

name: Build V19 final installers

on:
  push:
    branches:
      - codex/v19-organic-wellness
    paths:
      - '.github/workflows/build-v19-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final reset fix
        env:
          RESET_PATCH_B64: 
        run: |
          printf '%s' "$RESET_PATCH_B64" | base64 --decode > /tmp/v19-reset.patch
          git apply --check /tmp/v19-reset.patch
          git apply /tmp/v19-reset.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build phone and watch
        working-directory: treino-da-luana/v16
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace
      - name: Package phone
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-V19-Celular
          path: treino-da-luana/v16/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package Galaxy Watch8
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Luana-V19-Galaxy-Watch8
          path: treino-da-luana/v16/wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
